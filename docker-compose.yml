version: "3.8"

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7
    container_name: medical-portal-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medical-network

  # ============================================
  # Backend API (Express.js)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-portal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/medical_portal
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
      - JWT_EXPIRE=7d
    depends_on:
      - mongodb
    networks:
      - medical-network

  # ============================================
  # Frontend (React App served via Nginx)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medical-network

  # ============================================
  # Report AI (Vite App served via Nginx)
  # ============================================
  report-ai:
    build:
      context: ./report-ai
      dockerfile: Dockerfile
    container_name: medical-portal-report-ai
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - VITE_SUPABASE_PROJECT_ID=krhkdkissiqhzjeffvnt
      - VITE_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyaGtka2lzc2lxaHpqZWZmdm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNTM4MDAsImV4cCI6MjA4NzgyOTgwMH0.q2JtmOhxS0s7vg1uPfm-zZ4b2a6POmi4s1ZJ44asoyM
      - VITE_SUPABASE_URL=https://krhkdkissiqhzjeffvnt.supabase.co
    depends_on:
      - backend
    networks:
      - medical-network

# ============================================
# Persistent Volumes
# ============================================
volumes:
  mongodb_data:
    driver: local

# ============================================
# Docker Network
# ============================================
networks:
  medical-network:
    driver: bridge
