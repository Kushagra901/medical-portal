version: "3.8"

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7
    container_name: medical-portal-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medical-network

  # ============================================
  # Backend API (Express.js)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-portal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - mongodb
    networks:
      - medical-network

  # ============================================
  # Frontend (React App served via Nginx)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medical-network

  # ============================================
  # Report AI (Vite App served via Nginx)
  # ============================================
  report-ai:
    build:
      context: ./report-ai
      dockerfile: Dockerfile
    container_name: medical-portal-report-ai
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - ./report-ai/.env
    depends_on:
      - backend
    networks:
      - medical-network

# ============================================
# Persistent Volumes
# ============================================
volumes:
  mongodb_data:
    driver: local

# ============================================
# Docker Network
# ============================================
networks:
  medical-network:
    driver: bridge
